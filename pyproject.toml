[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "indgroup"
version = "0.2.0"
description = "Format and strictly parse numbers with Indian lakh and crore grouping and the digit grouping of every Unicode CLDR locale"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Unicode-3.0"
license-files = ["LICENSE", "LICENSE-UNICODE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["lakh", "crore", "indian numbering", "digit grouping", "thousands separator", "number format", "cldr", "i18n", "l10n", "intl", "numberformat", "decimal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Text Processing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Repository = "https://github.com/JaviLianes8/indgroup"
Issues = "https://github.com/JaviLianes8/indgroup/issues"
Changelog = "https://github.com/JaviLianes8/indgroup/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[project.scripts]
indgroup = "indgroup._cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/indgroup"]

[tool.hatch.build.targets.sdist]
# Third-party reference files are fetched locally and never shipped; only their manifest is.
exclude = [
    ".github",
    "IMPROVEMENTS-round*.md",
    "tests/upstream/*.tgz",
    "tests/upstream/*.cpp",
    "tests/upstream/*.html",
    "tests/upstream/intl-node.json",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
